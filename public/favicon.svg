<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 8 118 104">
  <!-- Shimekiri-chan's relaxed face, traced from src/components/Mascot.tsx with bolder
       lines and fewer fine details so it stays crisp at tab-icon size. -->
  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1b3f86"/>
      <stop offset="0.4" stop-color="#2f63c0"/>
      <stop offset="0.78" stop-color="#6a7fd6"/>
      <stop offset="1" stop-color="#9b8be0"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#dcefff"/>
      <stop offset="1" stop-color="#a9cdf2"/>
    </linearGradient>
    <g id="ear">
      <path d="M18 58L14 18q0-6 6-4l28 22Z" fill="#fff" stroke="#1f4a8f" stroke-width="4" stroke-linejoin="round"/>
      <path d="M22.5 50.5l-2.5-28 22 14.5Z" fill="#f7bfd0"/>
    </g>
    <g id="eye">
      <ellipse cx="38" cy="66" rx="11.5" ry="13" fill="url(#iris)"/>
      <path d="M27.6 68.6Q29.4 77 38.5 77.6Q31.8 75.1 30.6 68.6Z" fill="#fff"/>
      <circle cx="43" cy="59.5" r="3.8" fill="#fff"/>
      <ellipse cx="38" cy="66" rx="11.5" ry="13" fill="none" stroke="#1f4a8f" stroke-width="3.6"/>
      <path d="M28.5 57.5q-6-1.5-7.5-8M32 54.5q-4.5-3-4.5-9.5" fill="none" stroke="#1f4a8f" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <use href="#ear"/>
  <use href="#ear" transform="translate(120 0) scale(-1 1)"/>
  <path d="M60 29C92 29 110 46 111 64l7 4-6 4 7 5-8 2 4 6-8 1C99 100 82 109 60 109S21 100 15 86l-8-1 4-6-8-2 7-5-6-4 7-4C10 46 28 29 60 29Z" fill="#fff" stroke="#1f4a8f" stroke-width="4" stroke-linejoin="round"/>

  <ellipse cx="27" cy="85" rx="7" ry="4" fill="#f9b8c9"/>
  <ellipse cx="93" cy="85" rx="7" ry="4" fill="#f9b8c9"/>
  <use href="#eye"/>
  <use href="#eye" transform="translate(120 0) scale(-1 1)"/>

  <path d="M56.5 78.5q3.5-2 7 0q-1 3-3.5 3.5q-2.5-.5-3.5-3.5Z" fill="#f59ab3" stroke="#1f4a8f" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M51.5 84q4.25 2.5 8.5 0q4.25 2.5 8.5 0q-1.5 10-8.5 10t-8.5-10Z" fill="#f4a9bf" stroke="#1f4a8f" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Diamond stud on her ear. -->
  <circle cx="99.5" cy="30" r="5.2" fill="#dfe5ee" stroke="#1f4a8f" stroke-width="1.4"/>
  <circle cx="99.5" cy="30" r="3.6" fill="url(#diamond)"/>
  <circle cx="98.4" cy="28.9" r="1.2" fill="#fff"/>
</svg>
